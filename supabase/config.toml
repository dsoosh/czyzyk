# Supabase CLI configuration (local development and `supabase db push`).
# The hosted project must mirror the auth settings below – see docs/wdrozenie.md.
project_id = "czyzyk"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false

[storage]
enabled = true

[auth]
enabled = true
site_url = "env(PWA_URL)"
# czyzyk://auth/callback: Google sign-in started in the Android app returns there, not to the PWA.
additional_redirect_urls = ["http://localhost:5173", "env(PWA_URL)", "czyzyk://auth/callback"]
jwt_expiry = 3600
# Sign-ups stay enabled for OAuth; the before_user_created hook restricts them to the family.
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

# family-access: Google is the only sign-in method.
[auth.email]
enable_signup = false
enable_confirmations = false

[auth.sms]
enable_signup = false

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

# Rejects every email that is not on public.allowed_emails before the account exists.
[auth.hook.before_user_created]
enabled = true
uri = "pg-functions://postgres/public/hook_before_user_created"
