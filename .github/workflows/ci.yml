name: CI

on:
  push:
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - run: npm run spec:validate

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # assembleRelease (R8, unsigned here) catches release-only breakage before android-release.yml.
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace
      - name: Release APK size
        # Installed apps reject updates over 100 MiB (UpdateInfo.MAX_APK_BYTES).
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          size=$(stat -c%s "$apk")
          echo "Release APK: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -le 104857600
      - name: Unit test summary
        # Guards against tests being silently skipped: raise MIN_TESTS when adding tests.
        env:
          MIN_TESTS: 24
        run: |
          total=0; failed=0
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            t=$(grep -o '<testsuite [^>]*' "$f" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*')
            x=$(grep -o '<testsuite [^>]*' "$f" | grep -oE ' (failures|errors|skipped)="[0-9]*"' | grep -o '[0-9]*' | paste -sd+ | bc)
            echo "$(basename "$f"): tests=$t failed_or_skipped=$x"
            total=$((total + t)); failed=$((failed + x))
          done
          echo "TOTAL tests=$total failed_or_skipped=$failed" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$total" -ge "$MIN_TESTS" && test "$failed" -eq 0
      - uses: actions/upload-artifact@v4
        with:
          name: czyzyk-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
