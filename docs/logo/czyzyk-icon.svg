<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Czyżyk">

  <defs>
    <filter id="rough" x="-5%" y="-10%" width="110%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
    </filter>
    <filter id="roughSoft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3"/>
      <feDisplacementMap in="SourceGraphic" scale="2.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#fffdf6"/>
  <g transform="translate(12 90) scale(1.1)">

